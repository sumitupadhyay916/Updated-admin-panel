name: Admin Panel Deployment

on:
  push:
    branches:
      - develop-master-admin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Admin Panel via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true

          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22 || true

            echo "Navigating to Admin Panel folder..."
            cd ~/htdocs/innoradeadmin.hireacoder.in || exit 1

            echo "Pulling latest code..."
            git fetch origin develop-master-admin
            git reset --hard origin/develop-master-admin
            git clean -fd

            echo "Installing dependencies..."
            npm install

            echo "Building project..."
            npm run build

            echo "Starting or restarting PM2 app..."
            if pm2 show innorade-admin > /dev/null 2>&1; then
              pm2 restart innorade-admin
            else
              pm2 start "npx serve -s dist -l 5173" --name innorade-admin
            fi

            pm2 save
